<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고객 정보 변경</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="header">
    <a class="back" href="/">◀ 메인으로</a>
    <h1>고객 정보 변경</h1>
    <p>이름과 전화번호 뒷자리 4개로 검색해주세요</p>
  </div>
  <div class="container">
    <div class="card">
      <div class="search-row">
        <div class="field">
          <label>이름</label>
          <input id="name" type="text" placeholder="예: 홍길동">
        </div>
        <div class="field">
          <!-- 가이드 문구를 선택 항목으로 직관적으로 수정했습니다 -->
          <label>전화번호 뒷자리 4개 (선택)</label>
          <input id="last4" type="text" placeholder="번호 없는 고객은 빈칸" maxlength="4">
        </div>
      </div>
      <button class="btn btn-blue btn-full" style="margin-top:18px" onclick="doSearch()">검색하기</button>
    </div>
    <div id="results"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div class="content" id="modal-content"></div>
      <div class="modal-btns">
        <button class="btn btn-gray" id="modal-no">아니오</button>
        <button class="btn btn-blue" id="modal-yes">예</button>
      </div>
    </div>
  </div>

<script src="/static/script.js"></script>
<script>
// [변경점 1] 페이지가 열리면 이름과 뒷자리 검색창에 엔터키 이벤트를 심어줍니다.
document.addEventListener("DOMContentLoaded", () => {
  const inputs = [document.getElementById("name"), document.getElementById("last4")];
  inputs.forEach(input => {
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        doSearch(); // 엔터 누르면 검색 실행
      }
    });
  });
});

async function doSearch() {
  const name = document.getElementById("name").value.trim();
  const last4 = document.getElementById("last4").value.trim();
  const res = await fetch("/api/edit_search", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, last4})
  });
  const data = await res.json();
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (!data.ok) { showAlert("입력 확인", data.msg); return; }
  if (data.results.length === 0) {
    resultsDiv.innerHTML = '<div class="empty-msg">🔍 일치하는 고객 정보를 찾을 수 없습니다.</div>';
    return;
  }

  data.results.forEach(row => {
    const div = document.createElement("div");
    div.className = "result-card";
    div.innerHTML = `
      <div class="result-top">
        <span class="name">${row.name}</span>
        <span class="phone">${row.phone}</span>
        <span class="disabled-tag">이름/전화번호 수정 불가</span>
      </div>
      <div class="field">
        <label>코인 개수</label>
        <input id="coin-${row.idx}" type="text" value="${row.coin}">
      </div>
      <div class="field">
        <label>기타(비고)</label>
        <input id="memo-${row.idx}" type="text" value="${row.memo || ''}">
      </div>
      <button class="btn btn-blue" onclick="requestEdit(${row.idx})">변경하기</button>
    `;
    resultsDiv.appendChild(div);

    // [변경점 2] 검색 결과 내 코인 개수나 기타(비고) 입력란에서 엔터키를 쳐도 변경 처리가 실행되게 연결했습니다.
    const editInputs = [document.getElementById(`coin-${row.idx}`), document.getElementById(`memo-${row.idx}`)];
    editInputs.forEach(input => {
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          requestEdit(row.idx); // 엔터 누르면 변경 처리 함수 실행
        }
      });
    });
  });
}

async function requestEdit(idx) {
  const coin = document.getElementById(`coin-${idx}`).value.trim();
  const memo = document.getElementById(`memo-${idx}`).value.trim();

  const res = await fetch("/api/edit", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({idx, coin, memo})
  });
  const data = await res.json();
  if (!data.ok) { showAlert("입력 확인", data.msg); return; }
  if (data.no_change) { showAlert("알림", "변경된 내용이 없습니다."); return; }

  showModal(
    "변경 확인",
    `${data.name} 고객님 정보 변경\n\n[변경 전]\n코인 개수: ${data.old_coin}개\n기타: ${data.old_memo || "(없음)"}\n\n[변경 후]\n코인 개수: ${data.new_coin}개\n기타: ${data.new_memo || "(없음)"}\n\n정말로 변경하시겠습니까?`,
    async () => {
      const res2 = await fetch("/api/edit/confirm", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({idx: data.idx, new_coin: data.new_coin, new_memo: data.new_memo})
      });
      const data2 = await res2.json();
      showAlert("완료", data2.msg);
      setTimeout(() => doSearch(), 1200);
    },
    "변경하기", "btn-blue"
  );
}
</script>
</body>
</html>
