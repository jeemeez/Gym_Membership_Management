<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고객 코인 찾기</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="header">
    <a class="back" href="/">◀ 메인으로</a>
    <h1>고객 코인 찾기</h1>
    <p>이름과 전화번호 뒷자리 4개로 검색해주세요</p>
  </div>
  <div class="container">
    <div class="card">
      <div class="search-row">
        <div class="field">
          <label>이름</label>
          <input id="name" type="text" placeholder="예: 홍길동">
        </div>
        <div class="field">
          <!-- 가이드 문구를 선택 항목으로 직관적으로 수정했습니다 -->
          <label>전화번호 뒷자리 4개 (선택)</label>
          <input id="last4" type="text" placeholder="번호 없는 고객은 빈칸" maxlength="4">
        </div>
      </div>
      <button class="btn btn-blue btn-full" style="margin-top:18px" onclick="doSearch()">검색하기</button>
    </div>
    <div id="results"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div class="content" id="modal-content"></div>
      <div class="modal-btns">
        <button class="btn btn-gray" id="modal-no">아니오</button>
        <button class="btn btn-blue" id="modal-yes">예</button>
      </div>
    </div>
  </div>

<script src="/static/script.js"></script>
<script>
// [변경점 1] 페이지가 열리면 이름과 뒷자리 입력창에 엔터키 이벤트를 자동으로 심어줍니다.
document.addEventListener("DOMContentLoaded", () => {
  const inputs = [document.getElementById("name"), document.getElementById("last4")];
  inputs.forEach(input => {
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        doSearch(); // 엔터 누르면 검색 실행
      }
    });
  });
});

async function doSearch() {
  const name = document.getElementById("name").value.trim();
  const last4 = document.getElementById("last4").value.trim();
  const res = await fetch("/api/search", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, last4})
  });
  const data = await res.json();
  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if (!data.ok) { showAlert("입력 확인", data.msg); return; }
  if (data.results.length === 0) {
    resultsDiv.innerHTML = '<div class="empty-msg">🔍 일치하는 고객 정보를 찾을 수 없습니다.</div>';
    return;
  }

  data.results.forEach(row => {
    const div = document.createElement("div");
    div.className = "result-card";
    let withdrawHtml = '<p style="color:#8B95A1;font-weight:700;margin-top:14px;">수령 가능한 코인이 없습니다.</p>';
    if (row.coin > 0) {
      withdrawHtml = `
        <div class="withdraw-row">
          <span style="font-weight:700;">수령할 코인 개수</span>
          <input type="text" id="amt-${row.idx}" placeholder="숫자">
          <button class="btn btn-green" onclick="requestWithdraw(${row.idx}, '${row.name}')">수령 완료</button>
        </div>`;
    }
    div.innerHTML = `
      <div class="result-top">
        <span class="name">${row.name}</span>
        <span class="phone">${row.phone}</span>
      </div>
      <div class="coin-box">
        <div class="label">현재 남은 코인</div>
        <div class="value">${row.coin}개</div>
      </div>
      <div class="info-row"><span class="k">보관일</span><span class="v">${row.stock_date || "-"}</span></div>
      <div class="info-row"><span class="k">수령일</span><span class="v">${row.receipt_date || "-"}</span></div>
      <div class="info-row"><span class="k">비고</span><span class="v">${row.memo || "-"}</span></div>
      ${withdrawHtml}
    `;
    resultsDiv.appendChild(div);

    // [변경점 2] 코인 수령할 개수 적는 칸에서도 숫자 적고 엔터 치면 바로 수령 신청 버튼이 눌리게 연동했습니다.
    if (row.coin > 0) {
      const amtInput = document.getElementById(`amt-${row.idx}`);
      amtInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          requestWithdraw(row.idx, row.name);
        }
      });
    }
  });
}

async function requestWithdraw(idx, name) {
  const amount = document.getElementById(`amt-${idx}`).value.trim();
  const res = await fetch("/api/withdraw", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({idx, amount})
  });
  const data = await res.json();
  if (!data.ok) { showAlert("입력 확인", data.msg); return; }

  showModal(
    "수령 처리 확인",
    `${data.name} 고객님\n\n현재 코인: ${data.current_coin}개\n수령할 코인: ${data.amount}개\n수령 후 남은 코인: ${data.new_coin}개\n\n수령일을 오늘(${data.today})로 처리하시겠습니까?`,
    async () => {
      const res2 = await fetch("/api/withdraw/confirm", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({idx: data.idx, new_coin: data.new_coin})
      });
      const data2 = await res2.json();
      showAlert("처리 완료", `${name} 고객님의 코인 수령 처리가 완료되었습니다.\n남은 코인: ${data2.new_coin}개`);
      setTimeout(() => doSearch(), 1200);
    },
    "수령 완료", "btn-green"
  );
}
</script>
</body>
</html>
